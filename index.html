<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="description" content="Bastiaan van der Plaat's personal website" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Bastiaan van der Plaat</title>
        <link rel="shortcut icon" href="/favicon.ico" />
    </head>
    <body>
        <div id="screen">
            <div></div>
            <canvas></canvas>
        </div>

        <div id="boot">
            <div class="boot-screen">
                <img src="winxp/boot.png" alt="Windows XP is starting" />
                <div class="boot-bar"><div></div></div>
                <div id="boot-status" class="boot-status"></div>
            </div>
        </div>

        <div id="drop">
            <div class="drop-box">Drop files to copy them to the desktop</div>
        </div>

        <div id="activity" title="Loading from the network"></div>

        <div id="balloon" role="status" aria-live="polite">
            <div id="balloon-title" class="balloon-title"></div>
            <div id="balloon-text"></div>
        </div>

        <noscript>Windows XP needs JavaScript to boot.</noscript>
        <script type="module" src="/src/index.js"></script>
    </body>
</html>
