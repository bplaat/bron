cargo-features = ["panic-immediate-abort"]

[package]
name = "blocks"
version = "0.1.0"
edition = "2024"

[build-dependencies]
gxtexconv = { path = "../../../../lib/graphics/gxtexconv" }

# Unoptimized code is too slow for the Wii
[profile.dev]
opt-level = "s"
panic = "immediate-abort"

[profile.release]
opt-level = "s"
panic = "immediate-abort"
lto = false
codegen-units = 1
