[package]
name = "triangle"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
objc2 = { path = "../../../../lib/apple/objc2" }

[patch.crates-io]
objc2-proc-macros = { path = "../../../../lib/apple/objc2-proc-macros" }

[profile.release]
opt-level = "z"
panic = "abort"
lto = "fat"
