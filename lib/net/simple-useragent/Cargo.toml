[package]
name = "simple-useragent"
version = "0.1.4"
rust-version = "1.85"
description = "A simple user agent parser library based on the uap-core regexes"
keywords = ["useragent", "user-agent", "user-agent-parser", "uap", "uap-core"]
categories = ["parser-implementations", "web-programming"]
homepage = "https://github.com/bplaat/bron/tree/master/lib/net/simple-useragent"
edition = "2021"
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
regex = { version = "1.13", default-features = false, features = [
    "unicode-perl",
] }
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "simple-useragent"
harness = false

[features]
serde = ["dep:serde"]
