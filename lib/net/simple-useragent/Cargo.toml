[package]
name = "simple-useragent"
version = "0.1.4"
authors.workspace = true
categories = ["parser-implementations", "web-programming"]
edition = "2021"
homepage = "https://github.com/bplaat/bron/tree/master/lib/net/simple-useragent"
keywords = ["useragent", "user-agent", "user-agent-parser", "uap", "uap-core"]
license.workspace = true
repository.workspace = true
rust-version = "1.85"
description = "A simple user agent parser library based on the uap-core regexes"

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "simple-useragent"
harness = false
