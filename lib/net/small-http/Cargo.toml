[package]
name = "small-http"
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "now",
], optional = true }
log = { version = "0.4.34", optional = true }
native-tls = { version = "0.2.18", optional = true }
serde = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
serde_urlencoded = { version = "0.7.1", optional = true }
threadpool = { version = "2.0", optional = true }
url = "2.5"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["date", "multi-threaded"]
date = ["dep:chrono"]
form = ["dep:serde", "dep:serde_urlencoded"]
json = ["dep:serde", "dep:serde_json"]
log = ["dep:log"]
multi-threaded = ["dep:threadpool"]
tls = ["dep:native-tls"]
tls-vendored = ["native-tls/vendored"]
cgi = []

[[example]]
name = "small-http-client"
required-features = ["json", "tls"]

[[example]]
name = "small-http-client-pool"
required-features = ["tls"]
