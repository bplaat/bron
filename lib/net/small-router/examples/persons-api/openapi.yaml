openapi: 3.0.0
info:
  title: Persons API
  description: Example API for managing persons
  version: 0.1.0

servers:
  - url: http://localhost:8080

paths:
  # MARK: Misc
  /:
    get:
      tags: [Misc]
      summary: Home route
      responses:
        '200':
          description: Name and version of the API
          content:
            text/plain:
              schema:
                type: string

  # MARK: Persons
  /persons:
    get:
      tags: [Persons]
      summary: Get all persons
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A list of persons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonIndexResponse'
    post:
      tags: [Persons]
      summary: Create a new person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreateUpdateBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonCreateUpdateBody'
      responses:
        '201':
          description: Person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /persons/{personId}:
    get:
      tags: [Persons]
      summary: Get a person by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: A single person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid ID format
        '404':
          description: Person not found
    put:
      tags: [Persons]
      summary: Update a person by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonCreateUpdateBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PersonCreateUpdateBody'
      responses:
        '200':
          description: Person updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Invalid ID format or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          description: Person not found
    delete:
      tags: [Persons]
      summary: Delete a person by ID
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Person deleted
        '400':
          description: Invalid ID format
        '404':
          description: Person not found

components:
  # MARK: Parameters
  parameters:
    Id:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Query:
      name: q
      description: >-
        Search names using word prefixes, with the same syntax on all databases.
        Al and Al* both match Alice. Spaces or uppercase AND require both words
        (Alice Smith or Alice AND Smith); OR accepts either (Alice OR Bob);
        binary NOT excludes the following word (Alice NOT Smith). Precedence,
        highest first: spaces, NOT, AND, OR. Operators are case-sensitive.
        Quotes and parentheses are ignored; other punctuation separates words.
        Leading, trailing, and consecutive operators are ignored. Matching is
        case-insensitive and does not correct typos. An omitted or empty q lists
        all persons; a nonempty query without searchable words matches nothing.
        Queries longer than 128 characters return 400.
      in: query
      required: false
      schema:
        type: string
        maxLength: 128

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  # MARK: Schemas
  schemas:
    Report:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      required:
        - page
        - limit
        - total

    # MARK: Models
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ageInYears:
          type: integer
        relation:
          $ref: '#/components/schemas/Relation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - ageInYears
        - relation
        - createdAt
        - updatedAt

    Relation:
      type: string
      enum: [me, brother, sister]

    # MARK: Bodies
    PersonCreateUpdateBody:
      type: object
      properties:
        name:
          type: string
        ageInYears:
          type: integer
        relation:
          $ref: '#/components/schemas/Relation'
      required:
        - name
        - ageInYears
        - relation

    # MARK: Responses
    PersonIndexResponse:
      type: object
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          items:
            $ref: '#/components/schemas/Person'
      required:
        - pagination
        - data
