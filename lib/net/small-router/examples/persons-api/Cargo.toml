[package]
name = "example-persons-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
bsql = { version = "0.1.2", features = ["uuid", "chrono"] }
chrono = { version = "0.4.45", default-features = false, features = [
    "now",
    "serde",
] }
dotenvy = "0.15.7"
from_derive = { path = "../../../../data/from_derive" }
log = "0.4.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7.1"
simple_logger = "5.2"
small-http = { version = "0.2.1", features = ["json", "form", "cgi", "log"] }
small-router = { version = "0.2.1", features = ["log"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
validate = { path = "../../../../data/validate" }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
bsql = { version = "0.1.2", features = ["uuid", "chrono", "sqlite-bundled"] }

[build-dependencies]
openapi-generator = { path = "../../../../build/openapi-generator" }
