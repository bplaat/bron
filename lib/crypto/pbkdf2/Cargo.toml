[package]
name = "pbkdf2"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
getrandom = { version = "0.4.3", optional = true }
hmac = "0.13.0"
sha2 = { version = "0.11.1", default-features = false }
subtle = { version = "2.6", default-features = false }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "pbkdf2"
harness = false

[features]
default = ["std"]
std = ["dep:getrandom", "sha2/std"]
