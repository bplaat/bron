[package]
name = "bcanvas"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bwindow = { path = "../../ui/bwindow", default-features = false, optional = true }
image = { path = "../image", default-features = false, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { version = "0.6.5", optional = true }

[features]
default = ["window"]
image = ["dep:image"]
window = ["dep:bwindow", "dep:objc2"]
