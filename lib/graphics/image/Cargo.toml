[package]
name = "image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
default = ["qoi", "jpeg", "png", "gif", "bmp", "ico"]
qoi = []
jpeg = ["dep:libm"]
png = ["dep:crc", "dep:deflate"]
gif = ["dep:libm"]
bmp = []
ico = ["bmp", "png"]

[dependencies]
crc = { version = "3", optional = true }
deflate = { path = "../../data/deflate", optional = true }
libm = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "image"
harness = false
