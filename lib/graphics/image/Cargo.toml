[package]
name = "image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/mod.rs"

[features]
default = [
    "std",
    "bmp",
    "gif",
    "icns",
    "ico",
    "jpeg",
    "jpeg2000",
    "png",
    "pnm",
    "qoi",
    "tga",
    "webp",
]
std = []
bmp = []
gif = []
icns = ["jpeg2000", "png"]
ico = ["bmp", "png"]
jpeg = []
jpeg2000 = []
png = ["dep:crc", "dep:deflate"]
pnm = []
qoi = []
tga = []
webp = []

[dependencies]
crc = { version = "3", optional = true }
deflate = { path = "../../data/deflate", optional = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "image"
harness = false
