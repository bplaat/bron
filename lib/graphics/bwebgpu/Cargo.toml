[package]
name = "bwebgpu"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = "2.13"
bwindow = { path = "../../ui/bwindow", default-features = false, optional = true }
image = { path = "../image", default-features = false, optional = true }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"

[features]
default = ["window"]
image = ["dep:image"]
window = ["dep:bwindow"]
