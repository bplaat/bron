[package]
name = "vector"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["svg", "tinyvg"]
svg = ["dep:gzip", "dep:xmlparser"]
tinyvg = []

[dependencies]
gzip = { path = "../../data/gzip", optional = true }
xmlparser = { version = "0.13.6", optional = true }

[dev-dependencies]
criterion = "0.8"
image = { path = "../image", default-features = false, features = ["png"] }

[[bench]]
name = "vector"
harness = false
