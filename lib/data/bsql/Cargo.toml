[package]
name = "bsql"
version = "0.1.2"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["derive", "sqlite"]
derive = ["dep:bsql_derive"]
jiff = ["dep:jiff"]
mysql = ["dep:bitflags", "dep:sha2"]
mysql-native-password = ["mysql", "dep:sha1"]
mysql-tls = ["mysql", "dep:native-tls"]
sqlite = ["dep:libsqlite3-sys", "libsqlite3-sys/column-metadata"]
sqlite-bundled = ["sqlite", "libsqlite3-sys/bundled"]
sqlite-fts5 = ["sqlite", "libsqlite3-sys/fts5"]
uuid = ["dep:uuid"]

[dependencies]
bitflags = { version = "2.13", optional = true }
bsql_derive = { version = "0.1.1", optional = true }
jiff = { version = "1.0", default-features = false, optional = true }
libsqlite3-sys = { version = "0.39.1", optional = true }
native-tls = { version = "0.2.18", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
uuid = { version = "1.29", optional = true }

[dev-dependencies]
anyhow = "1.0"
jiff = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.29", features = ["v7"] }

[[example]]
name = "enum_from_value"
required-features = ["derive", "sqlite"]

[[example]]
name = "open_wal"
required-features = ["sqlite"]

[[example]]
name = "query_args"
required-features = ["sqlite"]

[[example]]
name = "query_some"
required-features = ["sqlite"]

[[example]]
name = "raw_bind"
required-features = ["sqlite"]

[[example]]
name = "raw_bind_named"
required-features = ["sqlite"]

[[example]]
name = "struct_from_row"
required-features = ["derive", "sqlite"]

[[example]]
name = "struct_from_row_jiff"
required-features = ["derive", "jiff", "sqlite"]

[[example]]
name = "struct_from_row_uuid"
required-features = ["derive", "sqlite", "uuid"]

[[example]]
name = "tuples"
required-features = ["sqlite"]
