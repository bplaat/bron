[package]
name = "bsql"
version = "0.1.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = { version = "2.13", optional = true }
bsql_derive = { version = "0.1.1", optional = true }
chrono = { version = "0.4.45", default-features = false, optional = true }
libsqlite3-sys = { version = "0.39.1", optional = true }
native-tls = { version = "0.2.18", optional = true }
sha1 = { version = "0.11.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
uuid = { version = "1.29", optional = true }

[dev-dependencies]
anyhow = "1.0"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
uuid = { version = "1.29", features = ["v7"] }

[features]
default = ["derive", "sqlite"]
chrono = ["dep:chrono"]
derive = ["dep:bsql_derive"]
mysql = ["dep:bitflags", "dep:sha2"]
mysql-native-password = ["mysql", "dep:sha1"]
mysql-tls = ["mysql", "dep:native-tls"]
sqlite = ["dep:libsqlite3-sys"]
sqlite-bundled = ["sqlite", "libsqlite3-sys/bundled-fts5"]
uuid = ["dep:uuid"]

[[example]]
name = "enum_from_value"
required-features = ["derive", "sqlite"]

[[example]]
name = "open_wal"
required-features = ["sqlite"]

[[example]]
name = "query_args"
required-features = ["sqlite"]

[[example]]
name = "query_some"
required-features = ["sqlite"]

[[example]]
name = "raw_bind"
required-features = ["sqlite"]

[[example]]
name = "raw_bind_named"
required-features = ["sqlite"]

[[example]]
name = "struct_from_row"
required-features = ["derive", "sqlite"]

[[example]]
name = "struct_from_row_chrono"
required-features = ["chrono", "derive", "sqlite"]

[[example]]
name = "struct_from_row_uuid"
required-features = ["derive", "sqlite", "uuid"]

[[example]]
name = "tuples"
required-features = ["sqlite"]
