[package]
name = "uuid"
version = "1.29.0+patch"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = { version = "0.4.3", optional = true }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
], optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
std = []
serde = ["dep:serde"]
v4 = ["std", "dep:getrandom"]
v7 = ["std", "dep:getrandom"]
