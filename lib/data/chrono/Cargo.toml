[package]
name = "chrono"
version = "0.4.45+patch"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
], optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["now"]
now = []
clock = ["now"]
serde = ["dep:serde"]
