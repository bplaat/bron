[package]
name = "bwebview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bwindow = { path = "../bwindow", default-features = false }
log = { version = "0.4.34", optional = true }
mime_guess = { version = "2.0", default-features = false, optional = true }
rust-embed = { version = "8.13", optional = true }
small-http = { version = "0.2.1", optional = true, default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"

[build-dependencies]
android-build = { path = "../../build/android-build" }

[dev-dependencies]
bwindow = { path = "../bwindow", features = [
    "dialog",
    "file_drop",
    "menu",
    "progress_bar",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["log"]
custom_protocol = ["dep:small-http"]
file_drop = ["bwindow/file_drop"]
log = ["dep:log"]
rust-embed = ["custom_protocol", "dep:rust-embed", "dep:mime_guess"]

[[example]]
name = "bwebview-file-drop"
required-features = ["file_drop"]
