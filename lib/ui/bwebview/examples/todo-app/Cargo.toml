[package]
name = "example-todo-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bwebview = { path = "../..", default-features = false, features = [
    "rust-embed",
] }
bwindow = { path = "../../../bwindow", default-features = false, features = [
    "remember_window_state",
] }
directories = "6.0"
rust-embed = "8.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["serde"] }
