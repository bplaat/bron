[package]
name = "bwindow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
directories = { version = "6.0", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6.4"
block2 = "0.6.2"

[target.'cfg(windows)'.dependencies]
directories = "6.0"

[features]
default = ["remember_window_state"]
dialog = []
file_drop = []
menu = []
progress_bar = []
remember_window_state = ["dep:directories"]
