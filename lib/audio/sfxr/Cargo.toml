[package]
name = "sfxr"
version = "0.1.4+patch"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# Without std synthesis uses C library math and random presets are unavailable
[features]
default = ["std"]
std = ["dep:getrandom"]

[dependencies]
getrandom = { version = "0.4.3", optional = true }
