[package]
name = "bastiaan"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }

[lints.rust]
warnings = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_const_for_fn = "deny"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
overflow-checks = false
