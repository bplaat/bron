name: plaatnotes-release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  plaatnotes-release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and push Docker image
        run: |
          VERSION=$(grep '^version' apps/web/plaatnotes/Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/bplaat/plaatnotes:${VERSION} \
            --tag ghcr.io/bplaat/plaatnotes:latest \
            --file apps/web/plaatnotes/Dockerfile \
            --push .
      - name: Create Git tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version' apps/web/plaatnotes/Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          gh release create "plaatnotes/v${VERSION}" --title "PlaatNotes v${VERSION}"
