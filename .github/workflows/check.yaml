name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_NIGHTLY: nightly-2026-11-14

jobs:
  # MARK: Check GitHub Actions lockfile
  check-lockfile:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # MARK: Check shared
  check-shared:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install packages and extra Rust tooling
        run: |
          wget -qO /usr/local/bin/clang-format https://github.com/cpp-linter/clang-tools-static-binaries/releases/download/llvm-23.1.3-2/clang-format-23_linux-amd64
          chmod a+x /usr/local/bin/clang-format
          clang-format --version
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod a+x /usr/local/bin/hadolint
          hadolint --version
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-deny taplo-cli
      - run: cargo xtask check-shared

  # MARK: Check rust
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-26.04
            cache-key: linux-x86_64
          - name: Linux aarch64
            runner: ubuntu-26.04-arm
            cache-key: linux-aarch64
          - name: macOS aarch64
            runner: macos-26
            cache-key: macos-aarch64
          - name: macOS x86_64
            runner: macos-26-intel
            cache-key: macos-x86_64
          - name: Windows x86_64
            runner: windows-2025
            cache-key: windows-x86_64
          - name: Windows aarch64
            runner: windows-11-arm
            cache-key: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcunit1-dev libgtk-3-dev libsecret-1-0 libwebkit2gtk-4.1-dev

      - name: Install packages (macos)
        if: runner.os == 'macOS'
        run: |
          brew install cunit nasm
          xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v6.1.0
        id: cache-rust-toolchain
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: ${{ matrix.cache-key }}-rust-with-tools-toolchain

      - name: Install extra Rust tooling (unix)
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          rustup toolchain add ${{ env.RUST_NIGHTLY }} --component rust-src --component rustfmt
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest

      - name: Install extra Rust tooling (windows)
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          rustup toolchain add ${{ env.RUST_NIGHTLY }} --component rust-src --component rustfmt
          iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
          cargo binstall -y --locked cargo-nextest

      - run: cargo xtask check-rust
        env:
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: line-tables-only

      - name: Build macOS examples
        if: runner.os == 'macOS'
        run: cargo xtask check-macos-examples

      - name: Report test results
        uses: dorny/test-reporter@v3.2.0
        if: always()
        with:
          name: Tests (${{ matrix.name }})
          path: target/nextest/*/junit*.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check e2e
  check-e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        id: cache-rust-toolchain
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: linux-x86_64-rust-with-tools-toolchain
      - name: Install extra Rust tooling
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true'
        run: |
          rustup toolchain add ${{ env.RUST_NIGHTLY }} --component rust-src --component rustfmt
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest
      - run: cargo xtask check-e2e
      - name: Report E2E test results
        uses: dorny/test-reporter@v3.2.0
        if: always()
        with:
          name: E2E Tests
          path: apps/web/plaatnotes/web/test-results/junit.xml,lib/ui/plaatui/examples/showcase/test-results/junit.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check others
  check-others:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install extra assembly and console dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson
          # LLVM is preinstalled with versioned tools; expose its unversioned binaries.
          dirname "$(readlink -f "$(command -v clang)")" >> "$GITHUB_PATH"
      - name: Install the Windows XP Rust toolchain
        run: |
          xp_nightly=$(sed -n "s/^rust_toolchain='\(.*\)'$/\1/p" tools/winxp-toolchain/build.sh)
          rustup toolchain install "$xp_nightly" --profile minimal --component rust-src --component clippy
      - name: Identify toolchain compilers
        id: compilers
        shell: bash
        run: |
          . tools/winxp-toolchain/llvm.sh
          signature=$({ clang --version; c++ --version; "${llvm}clang" --version; "$lld" --version; } | sha256sum)
          rust_signature=$(rustc -vV | sha256sum)
          echo "key=${signature%% *}" >> "$GITHUB_OUTPUT"
          echo "host-rust=${rust_signature%% *}" >> "$GITHUB_OUTPUT"
      # The toolchains and emulator runners only rebuild when their inputs are newer than their outputs,
      # so date the checkout before any cached build, the exact keys keep a stale build from being used
      - name: Date toolchain sources before cached builds
        run: |
          find tools/{nds,wii,wiiu,winxp}-toolchain lib/graphics/image lib/data/{deflate,gzip} \
            Cargo.toml Cargo.lock rust-toolchain.toml .cargo/config.toml -exec touch -d 2000-01-01 {} +
      - uses: actions/cache@v6.1.0
        with:
          path: target/nds-toolchain
          key: ubuntu-26.04-nds-toolchain-${{ steps.compilers.outputs.key }}-${{ hashFiles('tools/nds-toolchain/**', '!tools/nds-toolchain/test/**') }}
      - uses: actions/cache@v6.1.0
        with:
          path: target/wii-toolchain
          key: ubuntu-26.04-wii-toolchain-${{ steps.compilers.outputs.key }}-${{ steps.compilers.outputs.host-rust }}-${{ hashFiles('tools/wii-toolchain/**', '!tools/wii-toolchain/test/**', 'lib/graphics/image/**', 'lib/data/deflate/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - uses: actions/cache@v6.1.0
        with:
          path: target/wiiu-toolchain
          key: ubuntu-26.04-wiiu-toolchain-${{ steps.compilers.outputs.key }}-${{ steps.compilers.outputs.host-rust }}-${{ hashFiles('tools/wiiu-toolchain/**', '!tools/wiiu-toolchain/test/**', 'lib/graphics/image/**', 'lib/data/deflate/**', 'lib/data/gzip/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            target/winxp-toolchain/src
            target/winxp-toolchain/sysroot
            target/winxp-toolchain/clang/lib
          key: ubuntu-26.04-winxp-toolchain-${{ steps.compilers.outputs.key }}-${{ hashFiles('tools/winxp-toolchain/**', '!tools/winxp-toolchain/test/**') }}
      - name: Build examples and check console and Windows XP toolchains
        run: cargo xtask check-others
