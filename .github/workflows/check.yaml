name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # MARK: Check shared
  check-shared:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages and extra Rust tooling
        run: |
          wget -qO /usr/local/bin/clang-format https://github.com/cpp-linter/clang-tools-static-binaries/releases/download/llvm-23.1.3-2/clang-format-23_linux-amd64
          chmod a+x /usr/local/bin/clang-format
          clang-format --version
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod a+x /usr/local/bin/hadolint
          hadolint --version
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-deny taplo-cli
      - run: cargo xtask check-shared

  # MARK: Check rust
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-26.04
            cache-key: linux-x86_64
          - name: Linux aarch64
            runner: ubuntu-26.04-arm
            cache-key: linux-aarch64
          - name: macOS aarch64
            runner: macos-26
            cache-key: macos-aarch64
          - name: macOS x86_64
            runner: macos-26-intel
            cache-key: macos-x86_64
          - name: Windows x86_64
            runner: windows-2025
            cache-key: windows-x86_64
          - name: Windows aarch64
            runner: windows-11-arm
            cache-key: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcunit1-dev libgtk-3-dev libsecret-1-0 libusb-1.0-0 libwebkit2gtk-4.1-dev

      - name: Install packages (macos)
        if: runner.os == 'macOS'
        run: |
          brew install cunit nasm
          xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v5
        id: cache-rust-toolchain
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: ${{ matrix.cache-key }}-rust-with-tools-toolchain

      - name: Install extra Rust tooling (unix)
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          rustup toolchain add nightly --component rust-src --component rustfmt
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest

      - name: Install extra Rust tooling (windows)
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          rustup toolchain add nightly --component rust-src --component rustfmt
          iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
          cargo binstall -y --locked cargo-nextest

      - run: cargo xtask check-rust

      - name: Build macOS examples
        if: runner.os == 'macOS'
        run: cargo xtask check-macos-examples

      - name: Report test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Tests (${{ matrix.name }})
          path: target/nextest/*/junit*.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check e2e
  check-e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        id: cache-rust-toolchain
        with:
          path: |
            ~/.cargo
            ~/.rustup
          key: linux-x86_64-rust-with-tools-toolchain
      - name: Install extra Rust tooling
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true'
        run: |
          rustup toolchain add nightly --component rust-src --component rustfmt
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest
      - run: cargo xtask check-e2e
      - name: Report E2E test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Tests
          path: apps/web/plaatnotes/web/test-results/junit.xml,lib/ui/plaatui/examples/showcase/test-results/junit.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check others
  check-others:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install assembly and console toolchains and headless emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm python3 clang lld llvm make pkg-config libsdl2-dev meson ninja-build cmake zlib1g-dev
      # The toolchains and emulator runners only rebuild when their inputs are newer than their outputs,
      # so date the checkout before any cached build, the exact keys keep a stale build from being used
      - name: Date toolchain sources before cached builds
        run: find tools/nds-toolchain tools/wii-toolchain lib/graphics/image -exec touch -d 2000-01-01 {} +
      - uses: actions/cache@v5
        with:
          path: target/nds-toolchain
          key: linux-x86_64-nds-toolchain-${{ hashFiles('tools/nds-toolchain/**', '!tools/nds-toolchain/test/**') }}
      - uses: actions/cache@v5
        with:
          path: |
            target/wii-toolchain
            !target/wii-toolchain/test
          key: linux-x86_64-wii-toolchain-${{ hashFiles('tools/wii-toolchain/**', '!tools/wii-toolchain/test/**', 'lib/graphics/image/**') }}
      - name: Build assembly examples and games, run NDS and Wii toolchain tests, and build PlaatCraft for the Wii
        run: cargo xtask check-others
