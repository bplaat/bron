name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_NIGHTLY: nightly-2026-11-14

jobs:
  # MARK: Check GitHub Actions lockfile
  check-lockfile:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # MARK: Check shared
  check-shared:
    runs-on: ubuntu-26.04
    env:
      CARGO_DENY_VERSION: '0.22.0'
      TAPLO_VERSION: '0.10.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-ubuntu-26.04-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-ubuntu-26.04-
      - uses: actions/cache@v6.1.0
        id: cache-shared-tools
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/taplo
          key: cargo-tools-ubuntu-26.04-${{ env.CARGO_DENY_VERSION }}-${{ env.TAPLO_VERSION }}
      - name: Install formatting and Docker tools
        run: |
          wget -qO /usr/local/bin/clang-format https://github.com/cpp-linter/clang-tools-static-binaries/releases/download/llvm-23.1.3-2/clang-format-23_linux-amd64
          chmod a+x /usr/local/bin/clang-format
          clang-format --version
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          chmod a+x /usr/local/bin/hadolint
          hadolint --version
      - name: Install Cargo tools
        if: steps.cache-shared-tools.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked "cargo-deny@${{ env.CARGO_DENY_VERSION }}" "taplo-cli@${{ env.TAPLO_VERSION }}"
      - run: cargo xtask check-shared

  # MARK: Check rust
  check:
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      NEXTEST_VERSION: '0.9.152'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-26.04
          - name: Linux aarch64
            runner: ubuntu-26.04-arm
          - name: macOS aarch64
            runner: macos-26
          - name: macOS x86_64
            runner: macos-26-intel
          - name: Windows x86_64
            runner: windows-2025
          - name: Windows aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcunit1-dev libgtk-3-dev libsecret-1-0 libwebkit2gtk-4.1-dev

      - name: Install packages (macos)
        if: runner.os == 'macOS'
        run: |
          brew install cunit nasm
          xcrun --find metal >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Install nightly Rust
        run: rustup toolchain install ${{ env.RUST_NIGHTLY }} --profile minimal --component rust-src --component rustfmt

      - uses: Swatinem/rust-cache@v2.9.3
        env:
          CI_RUNNER_IMAGE: ${{ matrix.runner }}
        with:
          prefix-key: cargo
          env-vars: CI_RUNNER_IMAGE
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: actions/cache@v6.1.0
        id: cache-nextest
        with:
          path: ~/.cargo/bin/cargo-nextest*
          key: nextest-${{ runner.os }}-${{ runner.arch }}-${{ env.NEXTEST_VERSION }}

      - name: Install nextest (Unix)
        if: steps.cache-nextest.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked cargo-nextest --version ${{ env.NEXTEST_VERSION }}

      - name: Install nextest (Windows)
        if: steps.cache-nextest.outputs.cache-hit != 'true' && runner.os == 'Windows'
        run: |
          iex (iwr "https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.ps1").Content
          cargo binstall -y --locked cargo-nextest --version ${{ env.NEXTEST_VERSION }}

      - run: cargo xtask check-rust

      - name: Build macOS examples
        if: runner.os == 'macOS'
        run: cargo xtask check-macos-examples

      - name: Report test results
        uses: dorny/test-reporter@v3.2.0
        if: always()
        with:
          name: Tests (${{ matrix.name }})
          path: target/nextest/*/junit*.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check e2e
  check-e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.3
        env:
          CI_RUNNER_IMAGE: ubuntu-26.04
        with:
          prefix-key: cargo
          env-vars: CI_RUNNER_IMAGE
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-ubuntu-26.04-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-ubuntu-26.04-
      - run: cargo xtask check-e2e
      - name: Report E2E test results
        uses: dorny/test-reporter@v3.2.0
        if: always()
        with:
          name: E2E Tests
          path: apps/web/plaatnotes/web/test-results/junit.xml,lib/ui/plaatui/examples/showcase/test-results/junit.xml
          reporter: java-junit
          fail-on-error: 'false'

  # MARK: Check others
  check-others:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-ubuntu-26.04-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-ubuntu-26.04-
      - name: Install extra assembly and console dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson
          # LLVM is preinstalled with versioned tools; expose its unversioned binaries.
          dirname "$(readlink -f "$(command -v clang)")" >> "$GITHUB_PATH"
      - name: Install the Windows XP Rust toolchain
        run: |
          xp_nightly=$(sed -n "s/^rust_toolchain='\(.*\)'$/\1/p" tools/winxp-toolchain/build.sh)
          rustup toolchain install "$xp_nightly" --profile minimal --component rust-src --component clippy
      - name: Fingerprint toolchain build inputs
        id: toolchain-cache
        shell: bash
        env:
          NDS_SOURCES: ${{ hashFiles('tools/nds-toolchain/**', '!tools/nds-toolchain/test/**') }}
          WII_SOURCES: ${{ hashFiles('tools/wii-toolchain/**', '!tools/wii-toolchain/test/**', 'lib/graphics/image/**', 'lib/data/deflate/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          WIIU_SOURCES: ${{ hashFiles('tools/wiiu-toolchain/**', '!tools/wiiu-toolchain/test/**', 'lib/graphics/image/**', 'lib/data/deflate/**', 'lib/data/gzip/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          WINXP_SOURCES: ${{ hashFiles('tools/winxp-toolchain/**', '!tools/winxp-toolchain/test/**') }}
        run: |
          . tools/winxp-toolchain/llvm.sh
          native_compilers=$({ clang --version; c++ --version; "${llvm}clang" --version; "$lld" --version; } | sha256sum)
          host_rust=$(rustc -vV | sha256sum)

          fingerprint() {
            local toolchain=$1 digest
            shift
            digest=$(printf '%s\n' "$@" | sha256sum)
            printf '%s=%s\n' "$toolchain" "${digest:0:16}" >> "$GITHUB_OUTPUT"
          }

          fingerprint nds "${native_compilers%% *}" "$NDS_SOURCES"
          fingerprint wii "${native_compilers%% *}" "${host_rust%% *}" "$WII_SOURCES"
          fingerprint wiiu "${native_compilers%% *}" "${host_rust%% *}" "$WIIU_SOURCES"
          fingerprint winxp "${native_compilers%% *}" "$WINXP_SOURCES"
      # The toolchains and emulator runners only rebuild when their inputs are newer than their outputs,
      # so date the checkout before any cached build, the exact keys keep a stale build from being used
      - name: Date toolchain sources before cached builds
        run: |
          find tools/{nds,wii,wiiu,winxp}-toolchain lib/graphics/image lib/data/{deflate,gzip} \
            Cargo.toml Cargo.lock rust-toolchain.toml .cargo/config.toml -exec touch -d 2000-01-01 {} +
      - uses: actions/cache@v6.1.0
        with:
          path: target/nds-toolchain
          key: toolchain-nds-ubuntu-26.04-${{ steps.toolchain-cache.outputs.nds }}
      - uses: actions/cache@v6.1.0
        with:
          path: target/wii-toolchain
          key: toolchain-wii-ubuntu-26.04-${{ steps.toolchain-cache.outputs.wii }}
      - uses: actions/cache@v6.1.0
        with:
          path: target/wiiu-toolchain
          key: toolchain-wiiu-ubuntu-26.04-${{ steps.toolchain-cache.outputs.wiiu }}
      - uses: actions/cache@v6.1.0
        with:
          path: |
            target/winxp-toolchain/src
            target/winxp-toolchain/sysroot
            target/winxp-toolchain/clang/lib
          key: toolchain-winxp-ubuntu-26.04-${{ steps.toolchain-cache.outputs.winxp }}
      - name: Build the Bastiaan website and examples and check console and Windows XP toolchains
        run: cargo xtask check-others
