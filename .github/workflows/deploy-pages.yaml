name: deploy-pages

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    runs-on: ubuntu-26.04
    # The branches filter matches the head branch name, which a fork PR can also call master,
    # so only deploy check runs of pushes to this repository
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy the commit that the check run passed, not the latest master
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Install Rust WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: ubuntu-26.04
          cache-bin: 'false'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.npm/_cacache
          key: npm-ubuntu-26.04-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-ubuntu-26.04-
      - name: Read the locked wasm-bindgen version
        id: wasm-bindgen
        run: |
          package=$(cargo pkgid --locked --offline -p wasm-bindgen)
          echo "version=${package##*@}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        id: cache-wasm-bindgen
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-ubuntu-26.04-${{ steps.wasm-bindgen.outputs.version }}
      - name: Install wasm-bindgen
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        env:
          WASM_BINDGEN_VERSION: ${{ steps.wasm-bindgen.outputs.version }}
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
      - name: Build pages
        run: cargo xtask build-pages
      - name: Upload pages
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: './target/pages'
      - id: deployment
        name: Deploy pages
        uses: actions/deploy-pages@v5.0.1
