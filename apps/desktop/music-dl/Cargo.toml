[package]
name = "music-dl"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "Music Downloader"
identifier = "nl.bplaat.MusicDownloader"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.windows]
assets = "meta/windows"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
bwindow = { path = "../../../lib/ui/bwindow" }
bwebview = { path = "../../../lib/ui/bwebview", features = ["rust-embed"] }
directories = "6.0"
mp4ameta = "0.13.0"
percent-encoding = "2.3"
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
small-http = { version = "0.2.1", features = ["json", "tls"] }
threadpool = "2.0"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"

[build-dependencies]
winresource = "0.1.31"
