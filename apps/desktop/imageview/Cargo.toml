[package]
name = "imageview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "ImageView"
identifier = "nl.bplaat.ImageView"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.macos]
info_plist = "meta/macos/Info.plist"
hardened_runtime = true

[[package.metadata.bundle.macos.appex]]
name = "ImageView Preview"
identifier = "nl.bplaat.ImageView.Preview"
package = "../imageview-macos-preview"
binary = "imageview-macos-preview"
info_plist = "../imageview-macos-preview/Info.plist"
entitlements = "../imageview-macos-preview/Entitlements.plist"

[[package.metadata.bundle.macos.appex]]
name = "ImageView Thumbnail"
identifier = "nl.bplaat.ImageView.Thumbnail"
package = "../imageview-macos-thumbnail"
binary = "imageview-macos-thumbnail"
info_plist = "../imageview-macos-thumbnail/Info.plist"
entitlements = "../imageview-macos-thumbnail/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
windows_app_sdk = "2.0"

[[package.metadata.bundle.windows.file_types]]
name = "Animated PNG Image"
icon = 2
extensions = ["apng"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "BMP Image"
icon = 3
extensions = ["bmp", "dib"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "GIF Image"
icon = 4
extensions = ["gif"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "Apple Icon"
icon = 5
extensions = ["icns"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "Icon"
icon = 6
extensions = ["ico"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "JPEG 2000 Image"
icon = 7
extensions = ["j2c", "j2k", "jp2", "jpc"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "JPEG Image"
icon = 8
extensions = ["jfif", "jpe", "jpeg", "jpg"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "Netpbm Image"
icon = 9
extensions = ["pam", "pbm", "pgm", "pnm", "ppm"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "PNG Image"
icon = 10
extensions = ["png"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "QOI Image"
icon = 11
extensions = ["qoi"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "SVG Image"
icon = 12
extensions = ["svg", "svgz"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "TGA Image"
icon = 13
extensions = ["tga"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "TIFF Image"
icon = 14
extensions = ["tif", "tiff"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "TinyVG Image"
icon = 15
extensions = ["tvg"]
perceived_type = "image"

[[package.metadata.bundle.windows.file_types]]
name = "WebP Image"
icon = 16
extensions = ["webp"]
perceived_type = "image"

[package.metadata.bundle.windows.shell_extension]
package = "../imageview-windows-shell"
library = "imageview-shell"
thumbnail_handler = "80982B38-AE66-4D28-952E-410E1858801B"
preview_handler = "1D468AD5-F899-453B-8915-D19CD884DBAD"

[lints]
workspace = true

[dependencies]
bcanvas = { path = "../../../lib/graphics/bcanvas", default-features = false }
bwindow = { path = "../../../lib/ui/bwindow", features = [
    "dialog",
    "file_drop",
    "menu",
] }
imageview-core = { path = "../imageview-core" }

[target.'cfg(not(any(target_vendor = "apple", windows)))'.dependencies]
image = { path = "../../../lib/graphics/image" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"

[build-dependencies]
build-utils = { path = "../../../lib/build/build-utils" }
