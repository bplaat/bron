[package]
name = "bastiaan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bcanvas = { path = "../../../lib/graphics/bcanvas" }
bwindow = { path = "../../../lib/ui/bwindow" }
image = { path = "../../../lib/graphics/image", default-features = false, features = [
    "png",
] }
jiff = { version = "1.0", default-features = false, features = ["std"] }
vector = { path = "../../../lib/graphics/vector", default-features = false, features = [
    "tinyvg",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[build-dependencies]
build-utils = { path = "../../../lib/build/build-utils" }
