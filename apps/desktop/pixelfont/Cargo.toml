[package]
name = "pixelfont"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "Pixel Font Editor"
identifier = "nl.bplaat.PixelFontEditor"
copyright = "Copyright © 2026 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.macos]
info_plist = "meta/macos/Info.plist"
entitlements = "meta/macos/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
file_types = [{ name = "Pixel Font", extensions = ["pf"] }]

[lints]
workspace = true

[dependencies]
bwebview = { path = "../../../lib/ui/bwebview", features = [
    "rust-embed",
    "file_drop",
] }
bwindow = { path = "../../../lib/ui/bwindow", features = [
    "dialog",
    "file_drop",
    "menu",
] }
preferences = { path = "../../../lib/sys/preferences" }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1.31"
