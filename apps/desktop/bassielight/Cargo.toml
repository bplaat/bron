[package]
name = "bassielight"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "BassieLight"
identifier = "nl.bplaat.BassieLight"
copyright = "Copyright © 2025 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/macos/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"

[lints]
workspace = true

[dependencies]
bwebview = { path = "../../../lib/ui/bwebview", features = ["rust-embed"] }
bwindow = { path = "../../../lib/ui/bwindow" }
directories = "6.0"
local-ip-address = { version = "0.6.13" }
log = "0.4.34"
mime_guess = { version = "2.0", default-features = false, features = ["std"] }
rusb = "0.9.4"
rust-embed = { version = "8.13", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simple_logger = "5.2"
small-http = { version = "0.2.1", default-features = false }
small-websocket = { path = "../../../lib/net/small-websocket", default-features = false }

[build-dependencies]
copy_dir = "0.1.3"
winresource = "0.1.34"
