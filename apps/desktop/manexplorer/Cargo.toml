[package]
name = "manexplorer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata]
platforms = ["macos", "linux"]

[package.metadata.bundle]
name = "ManExplorer"
identifier = "nl.bplaat.ManExplorer"
copyright = "Copyright © 2025 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/macos/Entitlements.plist"

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
bwebview = { path = "../../../lib/ui/bwebview", features = ["rust-embed"] }
bwindow = { path = "../../../lib/ui/bwindow" }
preferences = { path = "../../../lib/sys/preferences" }
rust-embed = "8.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
small-http = { version = "0.2.1", default-features = false, features = [
    "json",
] }
small-router = { version = "0.2.1" }
