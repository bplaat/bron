[package]
name = "bastiaan-app"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "Bastiaan"
identifier = "nl.bplaat.Bastiaan"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"

[package.metadata.bundle.macos]
icon = "meta/macos/icon.icon"

[package.metadata.bundle.windows]
assets = "meta/windows"

[lints]
workspace = true

[dependencies]
bcanvas = { path = "../../../lib/graphics/bcanvas" }
bwindow = { path = "../../../lib/ui/bwindow" }
image = { path = "../../../lib/graphics/image", default-features = false, features = ["png"] }
jiff = { version = "1.0", default-features = false, features = ["std"] }
vector = { path = "../../../lib/graphics/vector", default-features = false, features = ["tinyvg"] }

[build-dependencies]
build-utils = { path = "../../../lib/build/build-utils" }
