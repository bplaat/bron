[package]
name = "imageview-core"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["edit"]
# Editing still images: tools, filters, selections and saving.
edit = []

[dependencies]
bcanvas = { path = "../../../lib/graphics/bcanvas", default-features = false }
image = { path = "../../../lib/graphics/image" }
vector = { path = "../../../lib/graphics/vector" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "edit"
harness = false
required-features = ["edit"]
