[package]
name = "macview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata]
platforms = ["macos"]

[package.metadata.bundle]
name = "MacView"
identifier = "nl.bplaat.MacView"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/macos/icon.icon"

[package.metadata.bundle.macos]
hardened_runtime = true

[[package.metadata.bundle.macos.appex]]
name = "MacView Preview"
identifier = "nl.bplaat.MacView.Preview"
package = "../macview-preview"
binary = "macview-preview"
info_plist = "../macview-preview/Info.plist"
entitlements = "../macview-preview/Entitlements.plist"

[[package.metadata.bundle.macos.appex]]
name = "MacView Thumbnail"
identifier = "nl.bplaat.MacView.Thumbnail"
package = "../macview-thumbnail"
binary = "macview-thumbnail"
info_plist = "../macview-thumbnail/Info.plist"
entitlements = "../macview-thumbnail/Entitlements.plist"

[lints]
workspace = true

[dependencies]
block2 = "0.6.2"
image = { path = "../../../lib/graphics/image" }
macview-appkit = { path = "../macview-appkit" }
objc2 = "0.6.4"
