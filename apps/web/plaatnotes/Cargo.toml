[package]
name = "plaatnotes"
version = "0.1.3"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.23.1"
bsql = { version = "0.1.2", features = ["jiff", "uuid", "sqlite-fts5"] }
dotenvy = "0.15.7"
from_derive = { path = "../../../lib/data/from_derive" }
getrandom = "0.4.3"
gzip = { path = "../../../lib/data/gzip" }
jiff = { version = "1.0", default-features = false, features = [
    "serde",
    "std",
] }
log = "0.4.34"
maxminddb = "0.32.0"
mime_guess = { version = "2.0", default-features = false }
pbkdf2 = { path = "../../../lib/crypto/pbkdf2" }
rust-embed = { version = "8.13", features = ["interpolate-folder-path"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7.1"
simple-useragent = { version = "0.1.2", features = ["serde"] }
simple_logger = "5.2"
small-http = { version = "0.2.1", features = ["json", "form", "log", "tls"] }
small-router = { version = "0.2.1", features = ["log"] }
uuid = { version = "1.29", features = ["v7", "serde"] }
validate = { path = "../../../lib/data/validate" }
zeroize = "1.9"
zip = "9.1"

[target.'cfg(any(target_vendor = "winxp", target_vendor = "win7", not(any(target_os = "macos", windows))))'.dependencies]
bsql = { version = "0.1.2", features = ["jiff", "uuid", "sqlite-bundled"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
small-http = { version = "0.2.1", features = ["tls-vendored"] }

[build-dependencies]
build-utils = { path = "../../../lib/build/build-utils" }
openapi-generator = { path = "../../../lib/build/openapi-generator" }
