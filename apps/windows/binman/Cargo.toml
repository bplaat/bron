[package]
name = "binman"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[package.metadata]
platforms = ["windows"]

[package.metadata.app]
name = "Binman"

[lints]
workspace = true

[dependencies]
anyhow = "1"
basic-toml = "0.1.10"
bwindow = { path = "../../../lib/ui/bwindow", features = ["progress_bar"] }
bwebview = { path = "../../../lib/ui/bwebview", features = [ "rust-embed"] }
directories = "6.0"
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1.31"
