[package]
name = "binman"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[package.metadata]
platforms = ["windows"]

[package.metadata.bundle]
name = "Binman"
identifier = "nl.bplaat.Binman"
copyright = "Copyright © 2026 Bastiaan van der Plaat"

[package.metadata.bundle.windows]
assets = "meta/windows"
virtualization = false
capabilities = ["allowElevation"]

[lints]
workspace = true

[dependencies]
anyhow = "1"
bwebview = { path = "../../../lib/ui/bwebview", features = ["rust-embed"] }
bwindow = { path = "../../../lib/ui/bwindow", features = ["progress_bar"] }
directories = "6.0"
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1.8", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }

[build-dependencies]
winresource = "0.1.31"
