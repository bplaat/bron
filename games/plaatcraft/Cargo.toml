[package]
name = "plaatcraft"
version = "0.2.0"
description = "Explore and build in a voxel world"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "PlaatCraft"
identifier = "nl.bplaat.PlaatCraft"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"
info_plist = "meta/apple/Info.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
# Win32 pointer lock needs window-station access unavailable in AppContainer.
sandbox = false

[package.metadata.bundle.linux]
icons = "meta/freedesktop/icons"
categories = ["Game", "Simulation"]
desktop_entry = "meta/freedesktop/.desktop"

[package.metadata.bundle.ios]
info_plist = "meta/apple/ios/Info.plist"

[package.metadata.bundle.android]

[dependencies]
baudio = { path = "../../lib/audio/baudio" }
bcanvas = { path = "../../lib/graphics/bcanvas", default-features = false }
bwebgpu = { path = "../../lib/graphics/bwebgpu" }
bwindow = { path = "../../lib/ui/bwindow", default-features = false, features = [
    "remember_window_state",
] }
cargo-bundle-assets = { path = "../../lib/build/cargo-bundle-assets" }
deflate = { path = "../../lib/data/deflate" }
directories = "6.0"
image = { path = "../../lib/graphics/image", default-features = false, features = [
    "png",
] }
libsqlite3-sys = "0.38"
plaatcraft-engine = { path = "../plaatcraft-engine" }
preferences = { path = "../../lib/sys/preferences" }

# Android has no public system SQLite library
[target.'cfg(target_os = "android")'.dependencies]
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

[build-dependencies]
bwebgpu-shader-build = { path = "../../lib/graphics/bwebgpu-shader-build" }
winresource = "0.1.31"

[lints]
workspace = true
