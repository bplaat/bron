[build]
target = "../../tools/wiiu-toolchain/wiiu.json"

[target.wiiu]
runner = "../../tools/wiiu-toolchain/run.sh"
rustflags = ["--extern", "alloc"]

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
json-target-spec = true

# cc-rs build scripts, like the bundled SQLite, compile with the Wii U C compiler
[env]
TARGET_CC = { value = "../../tools/wiiu-toolchain/cc", relative = true }
TARGET_AR = { value = "../../tools/wiiu-toolchain/ar", relative = true }
