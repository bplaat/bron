[package]
name = "plaatcraft-engine"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Without std the float functions link to the C library, like picolibc on the Wii
[features]
default = ["std"]
std = []
# The game client of the consoles: the menus, the streamed chunks, the SQLite worlds on the SD
# card, the LAN, the HUD and the controls, the ports add their GPU, input, sound and system
client = ["dep:libsqlite3-sys"]

[dependencies]
deflate = { path = "../../lib/data/deflate" }
libsqlite3-sys = { version = "0.39", optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
sfxr = { version = "0.1.4", default-features = false }

[dev-dependencies]
criterion = "0.8"
image = { path = "../../lib/graphics/image", default-features = false, features = [
    "png",
] }

[[bench]]
name = "world"
harness = false

[lints]
workspace = true
