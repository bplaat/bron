<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>2048</title>
        <link rel="stylesheet" href="/index.css" />
    </head>
    <body>
        <div class="container">
            <div class="heading">
                <h1 class="title">2048</h1>
                <div class="scores-container">
                    <div class="score-container">0</div>
                    <div class="best-container">0</div>
                </div>
            </div>

            <div class="above-game">
                <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
                <a class="restart-button">New Game</a>
            </div>

            <div class="game-container">
                <div class="game-message">
                    <p></p>
                    <div class="lower">
                        <a class="keep-playing-button">Keep going</a>
                        <a class="retry-button">Try again</a>
                    </div>
                </div>

                <div class="grid-container">
                    <div class="grid-row">
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                    </div>
                    <div class="grid-row">
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                    </div>
                    <div class="grid-row">
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                    </div>
                    <div class="grid-row">
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                        <div class="grid-cell"></div>
                    </div>
                </div>

                <div class="tile-container"></div>
            </div>

            <p class="game-explanation">
                <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles.
                When two tiles with the same number touch, they <strong>merge into one!</strong>
            </p>
        </div>

        <script>
            if (navigator.userAgent.includes('bwebview') && navigator.userAgent.includes('Macintosh')) {
                document.body.classList.add('is-bwebview-macos');
            }
            if (navigator.userAgent.includes('bwebview') && /iPhone|iPad|Android/.test(navigator.userAgent)) {
                document.body.classList.add('is-bwebview-mobile');
            }
        </script>
        <script src="/js/keyboard_input_manager.js"></script>
        <script src="/js/html_actuator.js"></script>
        <script src="/js/grid.js"></script>
        <script src="/js/tile.js"></script>
        <script src="/js/local_storage_manager.js"></script>
        <script src="/js/game_manager.js"></script>
        <script src="/js/application.js"></script>
    </body>
</html>
