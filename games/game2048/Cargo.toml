[package]
name = "game2048"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.bundle]
name = "2048"
identifier = "nl.bplaat.2048"
copyright = "Copyright © 2014 Gabriele Cirulli\nCopyright © 2025 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/apple/macos/Entitlements.plist"

[package.metadata.bundle.ios]
info_plist = "meta/apple/ios/Info.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
sandbox = true

[dependencies]
bwindow = { path = "../../lib/ui/bwindow" }
bwebview = { path = "../../lib/ui/bwebview", features = ["rust-embed"] }
rust-embed = "8.12"

[build-dependencies]
winresource = "0.1.31"
