[package]
name = "game2048"
version = "0.1.0"
description = "Join the numbers and get to the 2048 tile"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.bundle]
name = "2048"
identifier = "nl.bplaat.game2048"
copyright = "Copyright © 2014 Gabriele Cirulli\nCopyright © 2025 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/apple/macos/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
sandbox = true

[package.metadata.bundle.linux]
icons = "meta/freedesktop/icons"
categories = ["Game", "LogicGame"]

[package.metadata.bundle.ios]
info_plist = "meta/apple/ios/Info.plist"

[package.metadata.bundle.android]

[dependencies]
bwebview = { path = "../../lib/ui/bwebview", features = ["rust-embed"] }
bwindow = { path = "../../lib/ui/bwindow" }
preferences = { path = "../../lib/sys/preferences" }
rust-embed = "8.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winresource = "0.1.31"
