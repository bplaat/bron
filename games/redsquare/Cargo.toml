[package]
name = "redsquare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.bundle]
name = "RedSquare"
identifier = "nl.bplaat.RedSquare"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"

[package.metadata.bundle.macos]
info_plist = "meta/apple/macos/Info.plist"

[package.metadata.bundle.ios]

[package.metadata.bundle.android]

[dependencies]
baudio = { path = "../../lib/audio/baudio" }
bcanvas = { path = "../../lib/graphics/bcanvas" }
bwindow = { path = "../../lib/ui/bwindow" }
image = { path = "../../lib/graphics/image", default-features = false, features = ["png"] }
preferences = { path = "../../lib/sys/preferences" }

[build-dependencies]
build-utils = { path = "../../lib/build/build-utils" }
