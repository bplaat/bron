[package]
name = "frogger"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.bundle]
name = "Frogger"
identifier = "nl.bplaat.frogger"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/apple/macos/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
sandbox = true

[package.metadata.bundle.ios]

[package.metadata.bundle.android]

[dependencies]
baudio = { path = "../../lib/audio/baudio" }
bwindow = { path = "../../lib/ui/bwindow" }
bwebgpu = { path = "../../lib/graphics/bwebgpu" }
preferences = { path = "../../lib/sys/preferences" }
sfxr = "0.1.4"

[build-dependencies]
bwebgpu-shader-build = { path = "../../lib/graphics/bwebgpu-shader-build" }
winresource = "0.1.31"

[dev-dependencies]
image = { path = "../../lib/graphics/image", default-features = false, features = ["png"] }

[lints]
workspace = true
