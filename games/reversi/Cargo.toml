[package]
name = "reversi"
version = "0.1.0"
description = "Play Reversi against the computer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[package.metadata.bundle]
name = "Reversi"
identifier = "nl.bplaat.Reversi"
copyright = "Copyright (c) 2026 Bastiaan van der Plaat"
icon = "meta/apple/icon.icon"

[package.metadata.bundle.macos]
entitlements = "meta/apple/macos/Entitlements.plist"

[package.metadata.bundle.windows]
assets = "meta/windows"
sandbox = true

[package.metadata.bundle.linux]
icons = "meta/freedesktop/icons"
categories = ["Game", "BoardGame"]

[package.metadata.bundle.ios]

[package.metadata.bundle.android]

[dependencies]
bcanvas = { path = "../../lib/graphics/bcanvas" }
bwindow = { path = "../../lib/ui/bwindow", features = ["menu"] }
preferences = { path = "../../lib/sys/preferences" }
reversi-engine = { path = "../reversi-engine" }

[build-dependencies]
winresource = "0.1.31"
