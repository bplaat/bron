[package]
name = "bob"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
directories = "6.0"
dotenvy = "0.15.7"
plist = "1.10"
regex = { version = "1.13", default-features = false, features = [
    "std",
    "unicode-perl",
] }
serde = { version = "1.0", features = ["derive"] }
sha1 = "0.11.0"
small-http = { version = "0.2.1", default-features = false, features = ["tls"] }
terminal_size = "0.4.4"
threadpool = "2.0"
toml = { version = "1.1.8", default-features = false, features = [
    "std",
    "serde",
    "parse",
] }
url = "2.5"
zip = "9.1"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3.1"
