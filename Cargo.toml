[workspace]
members = [
    "apps/*/*",
    "games/*",
    "lib/*/*",
    "lib/*/*/examples/*",
    "tools/*",
]
exclude = [
    "examples/macos",
    "examples/wii",
    "games/empires",
    "games/nds",
    "games/plaatcraft",
    "lib/ui/plaatui",
    "lib/ui/plaatui/examples/showcase",
    "tools/nds-toolchain",
    "tools/wii-toolchain",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Bastiaan van der Plaat <bastiaan.v.d.plaat@gmail.com>"]
repository = "https://github.com/bplaat/bron"

[workspace.lints.rust]
warnings = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_const_for_fn = "deny"

[patch.crates-io]
base64 = { path = "lib/data/base64" }
block2 = { path = "lib/apple/block2" }
bsql = { path = "lib/data/bsql" }
bsql_derive = { path = "lib/data/bsql_derive" }
chrono = { path = "lib/data/chrono" }
copy_dir = { path = "lib/sys/copy_dir" }
crc = { path = "lib/data/crc" }
criterion = { path = "lib/test/criterion" }
digest = { path = "lib/crypto/digest" }
directories = { path = "lib/sys/directories" }
enable-ansi-support = { path = "lib/sys/enable-ansi-support" }
getrandom = { path = "lib/crypto/getrandom" }
hmac = { path = "lib/crypto/hmac" }
keyring = { path = "lib/sys/keyring" }
libsqlite3-sys = { path = "lib/data/libsqlite3-sys" }
local-ip-address = { path = "lib/net/local-ip-address" }
maxminddb = { path = "lib/net/maxminddb" }
mime = { path = "lib/net/mime" }
mime_guess = { path = "lib/net/mime_guess" }
native-tls = { path = "lib/net/native-tls" }
objc2 = { path = "lib/apple/objc2" }
objc2-proc-macros = { path = "lib/apple/objc2-proc-macros" }
plist = { path = "lib/data/plist" }
regex = { path = "lib/data/regex" }
rusb = { path = "lib/sys/rusb" }
rust-embed = { path = "lib/build/rust-embed" }
rust-embed-impl = { path = "lib/build/rust-embed-impl" }
serde_yaml = { path = "lib/data/serde_yaml" }
sha1 = { path = "lib/crypto/sha1" }
sha2 = { path = "lib/crypto/sha2" }
simple-useragent = { path = "lib/net/simple-useragent" }
simple_logger = { path = "lib/sys/simple_logger" }
small-http = { path = "lib/net/small-http" }
small-router = { path = "lib/net/small-router" }
terminal_size = { path = "lib/sys/terminal_size" }
threadpool = { path = "lib/sys/threadpool" }
trybuild = { path = "lib/test/trybuild" }
url = { path = "lib/net/url" }
uuid = { path = "lib/data/uuid" }
winresource = { path = "lib/build/winresource" }
zip = { path = "lib/data/zip" }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
overflow-checks = false

[profile.release.package.reversi-engine]
opt-level = 3

[profile.release.package.crc]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.pbkdf2]
opt-level = 3

[profile.release.package.sha1]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3
